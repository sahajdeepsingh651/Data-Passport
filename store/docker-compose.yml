services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: data-passport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data_passport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_passport}
      POSTGRES_DB: ${POSTGRES_DB:-data_passport}
    ports:
      # Host-side 5433, not 5432 — avoids colliding with any native Postgres install on the host.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_passport}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
